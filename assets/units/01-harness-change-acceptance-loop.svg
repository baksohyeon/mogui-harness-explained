<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow01" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#718096"/></marker></defs>
<rect width="640" height="760" fill="#ffffff"/>
<rect x="40" y="35" width="560" height="64" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="320" y="74" text-anchor="middle" font-size="20" fill="#1a202c">baseline score</text>
<path d="M320 99 L320 135" stroke="#718096" stroke-width="2" marker-end="url(#arrow01)"/>
<rect x="40" y="145" width="560" height="72" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
<text x="320" y="174" text-anchor="middle" font-size="20" fill="#1a202c"><tspan x="320" dy="0">proposer writes</tspan><tspan x="320" dy="26">candidate</tspan></text>
<path d="M320 217 L320 253" stroke="#718096" stroke-width="2" marker-end="url(#arrow01)"/>
<rect x="40" y="263" width="560" height="72" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="1.5"/>
<text x="320" y="292" text-anchor="middle" font-size="20" fill="#1a202c"><tspan x="320" dy="0">evaluate train +</tspan><tspan x="320" dy="26">holdout</tspan></text>
<path d="M320 335 L320 371" stroke="#718096" stroke-width="2" marker-end="url(#arrow01)"/>
<rect x="120" y="381" width="400" height="90" rx="14" fill="#ffffff" stroke="#6b46c1" stroke-width="1.5"/>
<text x="320" y="417" text-anchor="middle" font-size="20" fill="#1a202c"><tspan x="320" dy="0">combined passes &gt;</tspan><tspan x="320" dy="27">baseline?</tspan></text>
<path d="M250 471 C220 490 180 500 170 535" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow01)"/>
<text x="205" y="503" text-anchor="middle" font-size="18" fill="#1a202c">yes</text>
<path d="M390 471 C420 490 460 500 470 535" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow01)"/>
<text x="435" y="503" text-anchor="middle" font-size="18" fill="#1a202c">no</text>
<rect x="30" y="545" width="280" height="88" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
<text x="170" y="573" text-anchor="middle" font-size="20" fill="#1a202c"><tspan x="170" dy="0">keep,</tspan><tspan x="170" dy="25">PASS_COUNT_</tspan><tspan x="170" dy="25">INCREASED</tspan></text>
<rect x="330" y="545" width="280" height="88" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="1.5"/>
<text x="470" y="573" text-anchor="middle" font-size="20" fill="#1a202c"><tspan x="470" dy="0">reject,</tspan><tspan x="470" dy="25">NO_PASS_COUNT_</tspan><tspan x="470" dy="25">INCREASE</tspan></text>
</svg>
